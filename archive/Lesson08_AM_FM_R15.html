  16:{kind:'fm-goal',lead:'ב־FM המידע משנה את התדר הרגעי: את קצב התקדמות התנודות בכל רגע. המשרעת אינה אמורה לשאת את המידע.',cards:[['מה נכנס?','אות עם משרעת קבועה בקירוב, שבו מרווחי הזמן בין מחזורים משתנים.'],['מה נרצה לקבל?','מתח שמשתנה יחד עם סטיית התדר מתדר המרכז.']],takeaway:'גלאי FM ממיר שינויי תדר למתח מידע.',note:'הצביעו על ציר ההרץ לפני נוסחה. הדגישו שצפיפות המחזורים משתנה. מעבר: למה משרעת האות המתקבל אינה בהכרח קבועה?'},
  17:{kind:'limiter-need',lead:'התווך והמקלט יכולים להוסיף שינויי משרעת לאות FM. אלה אינם המידע המבוקש, ועלולים להשפיע על פעולת הגלאי.',cards:[['מה נרצה לשמר?','את תזמון התנודות ואת שינויי התדר הנושאים את המידע.'],['מהו מגבל?','מעגל שמגביל ערכים מעבר לרמות מתח מוגדרות. קטימה היא המנגנון; ייצוב אחרי עיבוד תלוי בתנאים.']],takeaway:'המגבל מיועד לצמצום השפעת הפרעת משרעת לפני גילוי FM.',note:'הראו אותו מופע עם ובלי הפרעת משרעת. אל תבטיחו הסרת כל רעש. מעבר: נזיז את סף הקטימה ונבדוק תוצאות מחושבות.'},
  18:{kind:'limiter',takeaway:'קטימה אינה ייצוב אוטומטי: היא עשויה לצמצם שינויי משרעת, ואינה מסירה את כל הרעש.',note:'השוו את שלושת הספים באותה כניסה. שאלו מדוע קטימה חלקית משאירה שינויי משרעת. הדגישו את שינוי סקאלת המוצא המסונן במצב עמוק. מעבר: נגדיר מה המגבל אינו מתקן.'},
  19:{kind:'limiter-limits',lead:'הגבלת שיאים אינה משחזרת כל אות פגום. התוצאה תלויה ברמת הכניסה, בסף, בסינון ובסוג ההפרעה.',cards:[['קטימה וסינון הן פעולות נפרדות','הקטימה מגבילה שיאים; מסנן מעביר פס מצמצם הרמוניות ורכיבים מחוץ לפס. שינויי משרעת עשויים להישאר.'],['הפרעת תדר או מופע','משנה את תזמון האות. קטימת המשרעת אינה מחזירה את התזמון המקורי.'],['אות חלש ורועש','המגבל אינו יכול לשחזר באופן מושלם מידע שכבר הוסתר ברעש.']],takeaway:'גם אחרי מגבל צריך גלאי תדר, וגם לו יש תחום פעולה ומגבלות.',note:'בקשו לבחור תקלה שהמגבל אינו פותר ולנמק. אם צריך, חזרו למתג המופע בשקף 18. מעבר: חלופה ראשונה לגילוי FM היא גלאי שיפוע.'},
  20:{kind:'slope-response',lead:'רשת עם תגובת תדר שאינה שטוחה מעבירה תדרים סמוכים במשרעות שונות. על צלע עולה, עליית תדר מגדילה את משרעת המוצא.',cards:[['נקודת העבודה','מציבים את תדר המרכז בצלע של עקומת התגובה, ולא בשיא שבו השיפוע מתאפס.'],['ההמרה הראשונה','לתדר רגעי נתון קוראים את הגבר H בעקומה. המשרעת במוצא נקבעת מן הכניסה כפול H.']],takeaway:'שינוי תדר יוצר שינוי משרעת רק בהתאם לשיפוע תגובת התדר.',note:'הזיזו תדר ובקשו לחזות את H לפני הקריאה. ציינו שזה קירוב קוואזי־סטטי ולא פתרון של מעגל תהודה מלא. מעבר: כעת אפשר לגלות את המעטפת שנוצרה.'},
  21:{kind:'slope-chain',lead:'אחרי ההמרה מתדר למשרעת, משתמשים בגלאי מעטפת. סינון והסרת רכיב קבוע נותנים מתח הקשור למידע.',cards:[['אותו תהליך בארבעה שלבים','תדר משתנה → תגובת תדר → מעטפת משתנה → גלאי מעטפת ועיבוד מוצא.'],['היכן נוצר עיוות?','כשהסטייה גדולה, עקמומיות התגובה משנה את היחס בין התדר למשרעת. גם לגלאי ולמסנן יש שגיאה והשהיה.']],takeaway:'גלאי שיפוע משתמש במעטפת שנוצרת מתגובת התדר; המשרעת אינה נבחרת באופן שרירותי.',note:'התאימו זמני תדר ומשרעת בין הגרפים. סינון יוצר השהיה ולכן לא דורשים חפיפה מושלמת. מעבר: אפשר לגלות FM גם באמצעות מתנד עוקב.'},
  22:{kind:'pll-need',lead:'גלאי שיפוע נשען על קטע מתאים של תגובת תדר. חלופה היא חוג משוב שמכוון מתנד פנימי כדי שיעקוב אחרי תדר הכניסה.',cards:[['מהו PLL?','לולאה נעולת מופע: משווה את מופע הכניסה למופע מתנד פנימי ומתקנת את תדר המתנד במשוב.'],['מתי מתקבל מידע?','כאשר הלולאה נעולה ועוקבת בתחום הפעולה, מתח הבקרה משקף בקירוב את שינויי התדר.']],takeaway:'שיפוע ו־PLL הם שתי חלופות לגילוי FM; אין לחבר ביניהם כשלבים הכרחיים בטור.',note:'אין לטעון ש־PLL תמיד טוב יותר או חסין לכל רעש. הציגו צורך בעקיבה ואת תנאי הפעולה. מעבר: נפרק את שלושת רכיבי החוג.'},
  23:{kind:'pll-loop',lead:'שלושה רכיבים יוצרים חוג סגור: משווה מופע, מסנן מעביר נמוכים ומתנד מבוקר מתח. מוצא המתנד מוחזר למשווה.',cards:[['משווה מופע — Phase Detector','מפיק אות התלוי בהפרש המופע בין הכניסה ל־VCO.'],['מסנן — LPF','מעבד את אות המשווה ומפיק מתח בקרה משתנה לאורך זמן.'],['מתנד מבוקר מתח — VCO','משנה תדר בהתאם למתח הבקרה וחוזר למשווה.']],takeaway:'מסלול המשוב הוא מה שמאפשר ללולאה לתקן את עצמה.',note:'הגדירו כל קיצור לפני שימוש נוסף. עקבו אחרי הקו החוזר ולא רק אחרי השרשרת הקדמית. מעבר: מה בדיוק מודד משווה המופע?'},
  24:{kind:'phase-detector',lead:'מופע מציין היכן נמצאים בתוך מחזור. אם תדרי האותות שונים, הפרש המופע משתנה עם הזמן; גם בתדרים שווים הוא עשוי להיות קבוע ולא אפס.',cards:[['מודל המשווה כאן','מוצא ממוצע סינוסואידלי: e תלוי בסינוס של הפרש המופע φ. Kd הוא מקדם מתח קבוע של המשווה.'],['אות שגיאה, לא מתח הבקרה','e יוצא מן המשווה. רק אחרי מסנן הלולאה מתקבל Vc שמפעיל את המתנד. e שאינו אפס אינו מוכיח הפרש תדר.']],formula:'pd',takeaway:'אין לזהות הפרש תדר, הפרש מופע ומוצא משווה כאותו גודל.',note:'הזיזו φ והראו שלאותו סינוס עשויים להיות מופעים שונים. אל תסיקו יציבות מכל חיתוך של האופיין. מעבר: המסנן מפריד בין תגובת המשווה למתח הבקרה.'},
  25:{kind:'pll-filter',lead:'מסנן הלולאה הוא מסנן מעביר נמוכים (LPF). מתח הבקרה במוצאו מגיב לאות המשווה לאורך זמן ולא קופץ מייד לערך הסופי.',cards:[['לפני המסנן: e','אות ממוצע של משווה המופע במודל שלנו, ביחידות וולט.'],['אחרי המסנן: Vc','מתח עם דינמיקה משלו. הוא קובע את תדר ה־VCO וממשיך להשתנות בזמן רכישה ומעקב.']],takeaway:'מסנן הלולאה משפיע על קצב התגובה ועל העקיבה; הוא אינו רק קו חיבור.',note:'השוו שני גרפים מאותה סימולציה. הגדירו τL רק בתיעוד אם אינו נדרש לתלמידים. מעבר: נבחן כיצד Vc משנה את תדר ה־VCO.'},
  26:{kind:'vco',lead:'מתנד מבוקר מתח משנה תדר כאשר מתח הבקרה משתנה. סביב נקודת עבודה אפשר לקרב את האופיין לקו ישר.',cards:[['רגישות המתנד','KVCO נמדד ב־Hz/V: כמה הרץ משתנים עבור כל וולט שינוי במתח הבקרה.'],['בתוך הלולאה','רכישה ונעילה אורכות זמן. שינוי Vc מייצג בקירוב את שינוי תדר המידע רק כשהלולאה נעולה ועוקבת.']],formula:'vco',takeaway:'תדרים שווים בנעילה אינם מחייבים הפרש מופע אפס.',note:'הבדילו בין f0 החופשי לבין התדר הנוכחי. השתמשו באותו KVCO שבסימולציה. מעבר: נראה את הלולאה מגלה אות FM לאורך זמן.'},
  27:{kind:'pll',takeaway:'פער עקיבה זמני אינו בהכרח אובדן נעילה. בנעילה, מתח הבקרה מאפשר למתנד לעקוב.',note:'הפעילו רכישה, נעילה ומעקב. בדרישה הגדולה עצרו לפני ואחרי החלקת מחזור. בקשו להסביר מדוע מתח הבקרה מכיל גם היסט קבוע. מעבר: נחשב שינוי מתח בתנאי נעילה ועקיבה.'},
  28:{kind:'exercise',exercise:'pll28',lead:'הלולאה נעולה ועוקבת, וה־VCO ליניארי בקירוב. מהו שינוי מתח הבקרה הדרוש לעליית התדר הנתונה?',takeaway:'מחלקים שינוי תדר ברגישות ב־Hz/V; מקבלים שינוי מתח בוולט.',note:'תנו זמן ניסיון. דרשו המרת kHz/V ל־Hz/V. הבדילו ΔVc מן המתח המוחלט, ואל תשתמשו בקירוב בזמן אובדן נעילה. מעבר: כוונון מקלט הוא מטרה אחרת.'},
  29:{kind:'afc',lead:'בקרת תדר אוטומטית (AFC) מתקנת סחיפה איטית של כוונון המקלט, למשל עקב שינוי בתדר המתנד המקומי.',cards:[['היכן התיקון פועל?','אות תיקון מוחזר לכוונון המתנד המקומי כדי להחזיר את האות לאזור העבודה של המקלט.'],['מה אינה עושה?','AFC אינה גלאי שמע. AGC משנה הגבר; AFC משנה כוונון; PLL לגילוי FM עוקב אחר שינויי המידע.']],takeaway:'יש להבחין בין תיקון כוונון איטי לבין גילוי שינויי התדר של המידע.',note:'התרשים מושגי ללא קוטביות חומרה אוניברסלית. אל תציגו את AFC כתחליף לגלאי. מעבר: נסכם את שתי חלופות הגילוי.'},
  30:{kind:'detector-compare',lead:'שתי החלופות ממירות שינויי תדר למתח, אך עושות זאת במנגנונים שונים ועם מגבלות שונות.',takeaway:'בוחרים חלופת גילוי לפי תחום העבודה ודרישות המערכת.',note:'בקשו מהכיתה לעקוב אחרי כל מסלול בנפרד. שיפוע מוגבל בעקמומיות ובנקודת העבודה; PLL מוגבל ביכולת רכישה ועקיבה. מעבר: תכנון עצמאי של גלאי AM.'},
  31:{kind:'exercise',exercise:'rc31',lead:'בחנו את הקבל המועמד C = 1 nF עבור הנגד הנתון; בדקו את הגל באפנון עמוק יותר.',takeaway:'מועמד מתמטי דורש גם בדיקת גל. אין RC שמבטיח שחזור מושלם בכל מצב.',note:'השאירו שבע דקות לתכנון ולנימוק. הציעו להשוות C קטן וגדול מן המועמד. הנוסחאון המחייב נשאר נושא פיתוח פתוח, בלי הודעה לתלמידים.'},
  32:{kind:'distortions',lead:'בשלושת הגרפים הכניסה והמעטפת זהות. זהו את התנהגות הפריקה מתוך המוצא, לפני חשיפת התשובה.',takeaway:'אדוות בין שיאים ופיגור במעטפת היורדת הם שני סימנים שונים.',note:'אל תחשפו את RC מראש. בקשו להצביע על ראיה בגרף לכל אבחנה. מעבר: נבדוק מה נשמר במגבל FM.'},
  33:{kind:'quiz',questions:[
    {q:'סף הקטימה גבוה מכל שיאי הכניסה. מה יקרה?',options:['האות יעבור ללא קטימה','המשרעת תתייצב בדיוק בסף'],answer:0,why:'המגבל משנה רק ערכים שעוברים את הסף. אם אין חצייה, אין קטימה.'},
    {q:'נוספה הפרעת מופע לאות. האם קטימת השיאים מבטלת אותה?',options:['כן, כל רעש נעלם אחרי מגבל','לא; שינוי בתזמון אינו מתוקן רק מהגבלת משרעת'],answer:1,why:'קטימה סימטרית מגבילה מתח; היא אינה יודעת מה היה התזמון המקורי.'}],takeaway:'הסבירו מה המגבל משנה באות ומה נשאר מחוץ ליכולת שלו.',note:'דרשו הסבר לשני המצבים ולא רק בחירה. אפשר לחזור למתג המופע בסימולציה. מעבר: בדיקת הבנה של PLL.'},
  34:{kind:'quiz',questions:[
    {q:'תדרי הכניסה וה־VCO נפרדו לרגע. האם זה מוכיח אובדן נעילה?',options:['כן; כל פער תדר הוא אובדן נעילה','לא; תיתכן שגיאת עקיבה זמנית ללא החלקת מחזור'],answer:1,why:'צריך לבחון את התנהגות הלולאה לאורך חלון זמן. בסימולציה נבדקת גם צבירת הפרש מופע.'},

// Retain extrema in each screen-x bin, in original time order, so narrow carrier peaks survive decimation.
function extremaIndices(values, first, last, bins = 1500) {
  const count = last - first + 1, step = Math.max(1, Math.ceil(count / bins)), ids = [];
  for (let a = first; a <= last; a += step) {
    const end = Math.min(last, a + step - 1); let lo = a, hi = a;
    for (let i = a + 1; i <= end; i++) { if (values[i] < values[lo]) lo = i; if (values[i] > values[hi]) hi = i; }
    for (const i of [...new Set([a, lo, hi, end])].sort((x, y) => x - y)) ids.push(i);
  }
  return ids;
}
function chart({ time, series, domain, range, width = 1000, height = 225, paddingRight = 22, compact = false, yLabel = 'מתח (V)', cursor, highlight, markers = [], guides = [], thresholds = [], ticks = 4, timeFactor = 1000, timeUnit = 'ms', xLabel = 'זמן' }) {
  const w = width, h = height, left = 74, right = paddingRight, top = compact ? 17 : 23, bottom = compact ? 32 : 45, pw = w - left - right, ph = h - top - bottom;
  const x = t => left + (t - domain[0]) / (domain[1] - domain[0]) * pw, y = v => top + (range[1] - v) / (range[1] - range[0]) * ph;
  const label = v => Math.abs(v) >= 1000 ? String(Math.round(v)) : Number(v.toFixed(2)).toString();
  let content = '';
  for (let k = 0; k <= ticks; k++) { const t = domain[0] + (domain[1] - domain[0]) * k / ticks; content += `<line class="svg-grid" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${h - bottom}"/><text class="svg-axis" direction="ltr" x="${x(t)}" y="${h - (compact ? 17 : 22)}" text-anchor="middle">${label(t * timeFactor)}</text>`; }
  for (let k = 0; k <= 2; k++) { const v = range[0] + (range[1] - range[0]) * k / 2; content += `<line class="svg-grid" x1="${left}" x2="${w - right}" y1="${y(v)}" y2="${y(v)}"/><text class="svg-axis" direction="ltr" x="${left - 10}" y="${y(v) + 5}" text-anchor="end">${label(v)}</text>`; }
  if (highlight) content += `<rect x="${x(highlight[0])}" y="${top}" width="${x(highlight[1]) - x(highlight[0])}" height="${ph}" fill="#dbeafe" opacity=".7"/>`;
  for (const v of thresholds) if (v >= range[0] && v <= range[1]) content += `<line x1="${left}" x2="${w - right}" y1="${y(v)}" y2="${y(v)}" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>`;
  const origin=time[0], spacing=time[1]-origin;
  const first = Math.max(0, Math.ceil((domain[0]-origin) / spacing-1e-7)), last = Math.min(time.length - 1, Math.floor((Math.min(cursor ?? domain[1], domain[1])-origin) / spacing+1e-7));
  for (const s of series) {
    const ids = extremaIndices(s.values, first, s.preview ? Math.min(time.length - 1, Math.floor((domain[1]-origin)/spacing+1e-7)) : last);
    const d = ids.map((i, j) => `${j ? 'L' : 'M'}${x(time[i]).toFixed(2)},${y(s.values[i]).toFixed(2)}`).join('');
    content += `<path data-series="${esc(s.name)}"${s.preview ? ' data-preview="true"' : ''} d="${d}" stroke="${s.color}" stroke-width="${s.width ?? 2}" fill="none" opacity="${s.opacity ?? 1}"${s.dashed ? ' stroke-dasharray="8 5"' : ''}/>`;
  }
  for (const g of guides) content += `<line data-guide="${esc(g.name ?? '')}" x1="${x(g.x)}" x2="${x(g.x)}" y1="${top}" y2="${h-bottom}" stroke="${g.color ?? '#64748b'}" stroke-width="2" stroke-dasharray="5 4"/>`;
  for (const m of markers) content += `<circle data-marker="${esc(m.name ?? '')}" data-x="${m.x}" data-y="${m.y}" cx="${x(m.x)}" cy="${y(m.y)}" r="6" fill="${m.color ?? '#b45309'}" stroke="white" stroke-width="2"/>`;
  if (cursor !== undefined) content += `<line x1="${x(cursor)}" x2="${x(cursor)}" y1="${top}" y2="${h - bottom}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" dir="ltr" role="img" aria-label="${esc(yLabel)} כפונקציה של ${esc(xLabel)}"><text class="svg-label" direction="rtl" x="${w - right}" y="16" text-anchor="start">${esc(yLabel)}</text>${content}<line class="svg-border" x1="${left}" x2="${w - right}" y1="${h - bottom}" y2="${h - bottom}"/><text class="svg-label" x="${w - right}" y="${h - 4}" text-anchor="end" direction="ltr">${esc(xLabel)} (${timeUnit})</text></svg>`;
}

// R5 post-detection teaching example. The envelope detector itself is unchanged.
function recoveryExample(){return cached('r5-recovery',()=>{
  const detector=envelope(70),{dt,fm}=detector.params,cutoff=5000;
  const count=Math.round(1/fm/dt),a=1-Math.exp(-2*Math.PI*cutoff*dt);
  const filtered=new Float64Array(detector.time.length);let p=0,q=0;
  // Warm the two causal low-pass stages with full periods of the computed Vc.
  for(let i=0;i<8*count;i++){p+=a*(detector.capacitor[i%count]-p);q+=a*(p-q);}
  for(let i=0;i<filtered.length;i++){p+=a*(detector.capacitor[i]-p);q+=a*(p-q);filtered[i]=q;}
  const dc=filtered.subarray(0,count).reduce((sum,v)=>sum+v,0)/count;
  const audio=Float64Array.from(filtered,v=>v-dc);
  return {type:'recovery',detector,time:detector.time,capacitor:detector.capacitor,filtered,audio,dc,cutoff,coefficient:a,periodSamples:count};
});}
function tauExample(){return cached('r5-tau',()=>{
  const detector=envelope(70);let start=Math.round(.00075/detector.params.dt);
  while(detector.conducting[start])start++;
  const initial=detector.capacitor[start],curve=discharge(detector.params.tauUs,initial);
  return {type:'tau-example',detector,start,sourceTime:detector.time[start],initial,curve,tau:curve.params.tau,atTau:curve.voltage[300],fraction:curve.voltage[300]/initial};
});}

function tauBody(){

  const svg=chart({time:r.curve.time,series:[series('free-discharge',r.curve.voltage,COLORS.capacitor,3.5)],domain:[0,4*r.tau],range:[0,2.2],height:300,paddingRight:36,timeFactor:1e6,timeUnit:'µs',guides:[{x:r.tau,name:'one-tau',color:COLORS.clipped}],thresholds:[r.atTau],markers:[{x:0,y:r.initial,name:'initial-voltage',color:COLORS.capacitor},{x:r.tau,y:r.atTau,name:'after-one-tau',color:COLORS.clipped}]});
  return `<div class="r5-tau"><section class="card r5-design-question"><h2>איך בוחרים את ערכי הנגד R והקבל C כך שמתח הקבל יעקוב בצורה נכונה אחרי מעטפת אות ה־AM?</h2><p>קבוע הזמן קובע את מהירות פריקת הקבל: לא מהר מדי בין שיאי הנושא, אך מהר מספיק כדי לעקוב אחרי הירידות במעטפת המידע.</p></section><div class="layout"><div class="plots">${cardPlot('אותו קבל — כעת בודקים פריקה חופשית',svg,`מתח התחלתי מתוך דוגמת שקף 4: ${unit(r.initial.toFixed(3),'V')}`)}<div class="r5-tau-values"><section class="card"><h2>בתחילת הפריקה</h2><strong>${bdi('V₀ = '+r.initial.toFixed(3)+' V')}</strong></section><section class="card"><h2>אחרי קבוע זמן אחד</h2><strong>${bdi('Vc(τ) = '+r.atTau.toFixed(3)+' V')}</strong><p>${(100*r.fraction).toFixed(1)}% מהמתח ההתחלתי</p></section></div></div><aside class="sidebar"><section class="card"><h2>ממה מורכב קבוע הזמן?</h2>${lessonFormula('tau')}<div class="parameter-list"><div dir="ltr"><strong>R</strong>${unit(10,'kΩ')}</div><div dir="ltr"><strong>C</strong>${unit(7,'nF')}</div><div dir="ltr"><strong>τ</strong>${unit(70,'µs')}</div></div></section><section class="card"><h2>מה נשאר אחרי זמן τ?</h2>${math(`${sub('V','C')}${mo('(')}${mi('τ')}${mo(')')}${mo('=')}${sub('V','0')}${mo('·')}<msup>${mi('e')}<mrow>${mo('−')}${mn(1)}</mrow></msup>${mo('≈')}${mn(r.atTau.toFixed(3))}${text(' V')}`)}<p>היחס הוא תמיד כ־36.8%, גם כשמתח ההתחלה שונה.</p></section><section class="card"><h2>ללא טעינה מחדש</h2><p>כאן המקור מנותק. בגלאי AM פעיל שיא נושא חדש עשוי לטעון שוב את הקבל.</p></section></aside></div></div>`;
}

// R6: annotations are selected from the existing detector samples, not idealized sketches.
function rcFailureExample(){return cached('r6-failures',()=>{
  const fast=envelope(1),slow=envelope(600),peaks=[];
  for(let i=1;i<fast.time.length-1;i++)if(fast.time[i]>=.00074&&fast.time[i]<=.00078&&fast.capacitor[i]>=fast.capacitor[i-1]&&fast.capacitor[i]>fast.capacitor[i+1])peaks.push(i);
  const first=peaks.find(i=>fast.time[i]>=.000749),last=peaks[peaks.indexOf(first)+1];
  let highIndex=first,lowIndex=first;
  for(let i=first;i<=last;i++){if(fast.capacitor[i]>fast.capacitor[highIndex])highIndex=i;if(fast.capacitor[i]<fast.capacitor[lowIndex])lowIndex=i;}
  let start=null,best=[0,0];
  // 80mV selects a projection-visible annotation region, without clipping either curve.
  for(let i=1;i<=Math.round(.001/slow.params.dt);i++){
    const visible=slow.ideal[i]<slow.ideal[i-1]&&slow.capacitor[i]-slow.ideal[i]>.08;
    if(visible&&start===null)start=i;
    if(!visible&&start!==null){if(i-1-start>best[1]-best[0])best=[start,i-1];start=null;}
  }
  let gapIndex=best[0];for(let i=best[0];i<=best[1];i++)if(slow.capacitor[i]-slow.ideal[i]>slow.capacitor[gapIndex]-slow.ideal[gapIndex])gapIndex=i;
  return {fast,slow,ripple:{first,last,highIndex,lowIndex,high:fast.capacitor[highIndex],low:fast.capacitor[lowIndex],span:fast.capacitor[highIndex]-fast.capacitor[lowIndex]},lag:{first:best[0],last:best[1],gapIndex}};
});}
function rcFailureChart(r,domain,{height=225,width=1000,ripple,lag,highlight}={}){
  const x=t=>74+(t-domain[0])/(domain[1]-domain[0])*(width-110),y=v=>23+(3.5-v)/3.5*(height-68);
  let svg=chart({time:r.time,series:[series('Envelope',r.ideal,COLORS.ideal,3,{dashed:true}),series('Vc',r.capacitor,COLORS.capacitor,2.6)],domain,range:[0,3.5],height,width,paddingRight:36,timeFactor:domain[1]-domain[0]<.0001?1e6:1000,timeUnit:domain[1]-domain[0]<.0001?'µs':'ms',highlight,markers:ripple?[{x:r.time[ripple.highIndex],y:ripple.high,name:'ripple-high',color:COLORS.capacitor},{x:r.time[ripple.lowIndex],y:ripple.low,name:'ripple-low',color:COLORS.capacitor}]:[]});
  if(lag){
    const ids=[];for(let i=lag.first;i<=lag.last;i+=12)ids.push(i);if(ids.at(-1)!==lag.last)ids.push(lag.last);
    const points=[...ids.map(i=>[x(r.time[i]),y(r.capacitor[i])]),...ids.toReversed().map(i=>[x(r.time[i]),y(r.ideal[i])])];
    const area=`<path data-lag-first="${r.time[lag.first]}" data-lag-last="${r.time[lag.last]}" d="${points.map(([a,b],i)=>`${i?'L':'M'}${a},${b}`).join('')}Z" fill="#f59e0b" opacity=".22"/>`;
    // Place the area behind the actual traces and the sample-derived gap arrow above them.
    svg=svg.replace('<path data-series=',area+'<path data-series=');
    const k=lag.gapIndex,px=x(r.time[k]),top=y(r.capacitor[k]),bottom=y(r.ideal[k]);
    svg=svg.replace('</svg>',`<g data-lag-gap="${k}" stroke="#b45309" stroke-width="3" fill="none"><path d="M${px} ${top}V${bottom}M${px-5} ${top+7}L${px} ${top}L${px+5} ${top+7}M${px-5} ${bottom-7}L${px} ${bottom}L${px+5} ${bottom-7}"/></g></svg>`);
  }
  if(ripple){
    const px=x(r.time[ripple.last]+1e-6),top=y(ripple.high),bottom=y(ripple.low);
    svg=svg.replace('</svg>',`<g data-ripple-span="${ripple.span}" data-cycle-first="${r.time[ripple.first]}" data-cycle-last="${r.time[ripple.last]}" stroke="#b45309" stroke-width="3" fill="none"><path d="M${px} ${top}V${bottom}M${px-5} ${top+7}L${px} ${top}L${px+5} ${top+7}M${px-5} ${bottom-7}L${px} ${bottom}L${px+5} ${bottom-7}"/><path d="M${x(r.time[ripple.highIndex])} ${top}H${px}M${x(r.time[ripple.lowIndex])} ${bottom}H${px}" stroke-width="1.5" stroke-dasharray="4 3"/></g></svg>`);
  }
  return svg;
}

  const visual=fast?`${cardPlot('מחזור מידע שלם — מוצא גלי במקום מעטפת חלקה',rcFailureChart(r,[0,.001],{highlight:[.00074,.00078]}))}${cardPlot('הגדלת החלון הכחול — טעינה ופריקה חוזרות',rcFailureChart(r,[.00074,.00078],{height:240,ripple:e.ripple,highlight:[r.time[e.ripple.first],r.time[e.ripple.last]]}),`האזור המוצל: מחזור נושא אחד; החץ הכתום: שיא–שפל`)}<div class="r6-process"><span>טעינה בשיא</span><b>←</b><span>פריקה מהירה דרך R</span><b>←</b><span>טעינה מחדש</span></div>`:
  `${cardPlot('המעטפת יורדת — מתח הקבל נשאר מעליה',rcFailureChart(r,[0,.001],{height:260,lag:e.lag}))}<p class="r6-lag-label">הקבל נפרק לאט מדי — אינו עוקב אחרי הירידה</p><div class="r6-comparison"><section class="card"><h2>RC קטן מדי · תנודות מהירות</h2><div class="svg-host">${rcFailureChart(e.fast,[.00074,.00078],{width:500,height:175})}</div><p>טעינה ופריקה בין שיאי הנושא</p></section><section class="card"><h2>RC גדול מדי · צורת מידע משתבשת</h2><div class="svg-host">${rcFailureChart(e.slow,[0,.001],{width:500,height:175,lag:e.lag})}</div><p>פריקה שאינה משיגה מעטפת יורדת</p></section></div>`;
  return `<div class="layout r6-failure r6-slide-${s.number}"><div class="plots">${key}${visual}</div><aside class="sidebar"><section class="card r6-lead"><p>${s.lead}</p></section>${s.cards.map(([h,p])=>`<section class="card"><h2>${h}</h2><p>${p}</p></section>`).join('')}<section class="card r6-parameters"><p>${bdi('RC = '+r.params.tauUs+' µs')} · אותה כניסת AM</p><p class="small">${unit(r.params.fc/1000,'kHz')} נושא · ${unit(r.params.fm/1000,'kHz')} מידע · ${bdi('m = 0.6')}</p></section></aside></div>`;
}

// R7: both teaching views measure exactly the same complete carrier cycle.
function rcBalanceMeasurement(r){
  const first=Math.round(.00043/r.params.dt),last=first+Math.round(1/r.params.fc/r.params.dt);
  let highIndex=first,lowIndex=first,overshootIndex=null,overshoot=0;
  for(let i=first;i<=last;i++){
    if(r.capacitor[i]>r.capacitor[highIndex])highIndex=i;
    if(r.capacitor[i]<r.capacitor[lowIndex])lowIndex=i;
    const gap=r.capacitor[i]-r.ideal[i];if(gap>overshoot){overshoot=gap;overshootIndex=i;}
  }
  return {first,last,domain:[r.time[first],r.time[last]],highIndex,lowIndex,high:r.capacitor[highIndex],low:r.capacitor[lowIndex],ripple:r.capacitor[highIndex]-r.capacitor[lowIndex],overshoot,overshootIndex};
}
const rcBalanceVoltage=v=>(v===0?'0':String(Number(v.toPrecision(4))))+' V';
function rcBalanceMetrics(m){return `<div class="r12-rc-lesson"><h3>איך בודקים את המוצא?</h3><p><strong>בין שיאי הנושא:</strong> פריקה מהירה מדי יוצרת אדוות גדולות.</p><p><strong>בירידת המעטפת:</strong> פריקה איטית מדי משאירה את מתח הקבל גבוה מדי.</p></div>`;}

function rcBalanceGraphs(r,m=rcBalanceMeasurement(r)){
  const overview=chart({time:r.time,series:[series('Envelope',r.ideal,COLORS.ideal,3,{dashed:true}),series('Vc',r.capacitor,COLORS.capacitor,2.6)],domain:[0,.001],range:[0,3.5],height:230,paddingRight:36,highlight:m.domain}).replace('</svg>',`<rect data-measurement-first="${m.domain[0]}" data-measurement-last="${m.domain[1]}" x="${74+m.domain[0]/.001*890}" y="23" width="${(m.domain[1]-m.domain[0])/.001*890}" height="162" fill="none" stroke="#0891b2" stroke-width="3"/></svg>`);
  let min=Infinity,max=-Infinity;for(let i=m.first;i<=m.last;i++){min=Math.min(min,r.capacitor[i],r.ideal[i]);max=Math.max(max,r.capacitor[i],r.ideal[i]);}

  const controls=response?`<label for="slope-frequency">תדר רגעי בכניסה <output id="slope-value" dir="ltr"></output></label><input id="slope-frequency" type="range" min="8000" max="12000" step="50" value="${extraState.frequency}" aria-label="תדר בדיקה של הרשת בהרץ"><div class="presets"><button data-slope-f="10000">מרכז על השיפוע</button><button data-slope-f="12000">שיא התגובה</button></div>`:`<div class="slope-control-pair"><div><label for="slope-deviation">סטיית התדר <output id="slope-value" dir="ltr"></output></label><input id="slope-deviation" type="range" min="200" max="1200" step="50" value="${extraState.deviation}" aria-label="סטיית תדר בהרץ"></div><div><label for="slope-time">סמן זמן משותף <output id="slope-time-value" dir="ltr"></output></label><input id="slope-time" type="range" min="0" max="100" step="0.1" value="${extraState.sampleTime*1000}" aria-label="סמן זמן במילישניות"></div></div>`;
  const chain=response?'':`<div class="slope-chain-flow" aria-label="שרשרת גילוי שיפוע"><span>תדר רגעי</span><b>←</b><span>תגובת תדר H</span><b>←</b><span>משרעת</span><b>←</b><span>גלאי מעטפת</span><b>←</b><span>מתח מידע</span></div>`;
  if(response) shell(`<div class="layout slope-layout"><div class="plots"><section class="card slope-controls">${controls}</section>${chain}<div id="slope-graphs" class="plots"></div><p class="plot-note">קירוב קוואזי־סטטי של המשרעת; לא סימולציה מלאה של מעגל תהודה.</p></div>${explainSide(s)}</div>`,s.takeaway);
  else shell(`<div class="layout slope-layout slope-chain-layout"><div id="slope-graphs" class="plots"></div><aside class="sidebar"><section class="card slope-controls">${controls}</section><section class="card slope-chain-explanation"><h2>מתדר למתח מידע</h2>${chain}<p>תגובת התדר יוצרת מעטפת; גילוי, סינון והסרת DC מפיקים מתח מידע. עקמומיות התגובה עלולה לעוות, ולגלאי ולמסנן יש שגיאה והשהיה.</p></section><section class="card slope-sample" id="slope-sample"></section><p class="plot-note">קירוב קוואזי־סטטי של המשרעת; לא סימולציה מלאה של מעגל תהודה.</p></aside></div>`,s.takeaway);
  const update=()=>{
    if(response){
      const frequency=Float64Array.from({length:1001},(_,i)=>6000+i*10),h=Float64Array.from(frequency,slopeResponse),selected=extraState.frequency,gain=slopeResponse(selected),delta=200;
      const svg=chart({time:frequency,series:[{name:'H',values:h,color:COLORS.capacitor,width:3.5}],domain:[6000,16000],range:[0,1.08],height:160,yLabel:'הגבר H (ללא יחידות)',timeFactor:.001,timeUnit:'kHz',xLabel:'תדר',guides:[{x:SLOPE.f0,color:COLORS.ideal,name:'center'},{x:SLOPE.fr,color:COLORS.capacitor,name:'peak'},{x:selected,color:COLORS.clipped,name:'selected'}],markers:[{x:SLOPE.f0,y:slopeResponse(SLOPE.f0),color:COLORS.ideal,name:'center'},{x:SLOPE.fr,y:1,color:COLORS.capacitor,name:'peak'},{x:selected,y:gain,color:COLORS.clipped,name:'selected'}]});
      ix('slope-value').textContent=`${selected} Hz`;
      ix('slope-graphs').innerHTML=legend([['מרכז 10 kHz',COLORS.ideal],['שיא 12 kHz',COLORS.capacitor],['תדר נבחר',COLORS.clipped]])+`<section class="card plot-card"><h2>${selected===SLOPE.fr?'בשיא: השיפוע המקומי אפס':'על הצלע: שינוי תדר משנה את ההגבר'}</h2><div class="svg-host">${svg}</div></section><div class="slope-readout" id="slope-readout"><bdi dir="ltr">f = ${selected} Hz → H = ${gain.toFixed(3)}</bdi><bdi dir="ltr">H(${selected-delta} Hz) = ${slopeResponse(selected-delta).toFixed(3)} · H(${selected+delta} Hz) = ${slopeResponse(selected+delta).toFixed(3)}</bdi><span>${selected===SLOPE.fr?'סטיות שוות לשני הצדדים נותנות אותו H: אין הבחנה ליניארית בסימן הסטייה.':'השוו סטיות של 200 Hz לשני הצדדים: ההגברים שונים.'}</span></div>`;
      onResult({type:'slope-response',frequency,h,selected,gain,delta,gainBelow:slopeResponse(selected-delta),gainAbove:slopeResponse(selected+delta)});
    }else{
      if(!slopeResults.has(extraState.deviation))slopeResults.set(extraState.deviation,simulateSlope(extraState.deviation));
      const r=slopeResults.get(extraState.deviation),i=Math.min(r.time.length-1,Math.max(0,Math.round(extraState.sampleTime/r.params.dt))),t=r.time[i];
      ix('slope-value').textContent=`±${r.params.deviation} Hz`;ix('slope-time-value').textContent=`${(t*1000).toFixed(1)} ms`;
      const items=[['1 · תדר רגעי בכניסה',[{name:'frequency',values:r.frequency,color:COLORS.input,width:3}],[8500,11500],'תדר (Hz)','frequency'],['2 · המעטפת שנוצרה ומתח הקבל',[{name:'amplitude',values:r.amplitude,color:COLORS.ideal,dashed:true,width:2.5},{name:'capacitor',values:r.capacitor,color:COLORS.capacitor,width:1.5}],[0,1.05],'מתח (V)','amplitude'],['3 · מתח מידע: אחרי סינון והסרת DC',[{name:'recovered',values:r.recovered,color:COLORS.control,width:3}],[-.35,.35],'מתח מידע (V)','recovered']];
      ix('slope-sample').innerHTML=`<strong>בזמן הסמן המשותף</strong><bdi dir="ltr">t = ${(t*1000).toFixed(1)} ms</bdi><bdi dir="ltr">f = ${r.frequency[i].toFixed(0)} Hz</bdi><bdi dir="ltr">H = ${slopeResponse(r.frequency[i]).toFixed(3)} → A = ${r.amplitude[i].toFixed(3)} V</bdi>`;
      ix('slope-graphs').innerHTML=items.map(([title,series,range,yLabel,key])=>`<section class="card plot-card"><div class="plot-title">${title}${key==='amplitude'?'<small>ירוק מקווקו: מעטפת · סגול: קבל</small>':''}</div><div class="svg-host">${chart({time:r.time,series,domain:[0,.1],range,yLabel,height:158,compact:true,ticks:5,guides:[{x:t,name:'shared-time'}],markers:[{x:t,y:r[key][i],color:series[0].color,name:key}]})}</div></section>`).join('');
      onResult({...r,selection:{index:i,time:t,frequency:r.frequency[i],gain:slopeResponse(r.frequency[i]),amplitude:r.amplitude[i]}});
    }
  };
  ix(response?'slope-frequency':'slope-deviation').addEventListener('input',e=>{extraState[response?'frequency':'deviation']=Number(e.target.value);update();});
  if(response)document.querySelectorAll('[data-slope-f]').forEach(b=>b.addEventListener('click',()=>{extraState.frequency=Number(b.dataset.slopeF);ix('slope-frequency').value=String(extraState.frequency);update();}));
  else ix('slope-time').addEventListener('input',e=>{extraState.sampleTime=Number(e.target.value)/1000;update();});
  update();
}

function bindPhase(s,shell,onResult){
  const phiValues=Float64Array.from({length:601},(_,i)=>-Math.PI+i/600*2*Math.PI),voltages=Float64Array.from(phiValues,p=>PLL.kd*Math.sin(p));
  shell(`<div class="layout"><div class="plots"><section class="card slope-controls"><label for="phase-range">הפרש מופע φ <output id="phase-value" dir="ltr"></output></label><input id="phase-range" type="range" min="-3.14" max="3.14" step="0.01" value="${extraState.phase}" aria-label="הפרש מופע ברדיאנים"></section><section class="card plot-card"><h2>אופיין המשווה הסינוסואידלי במודל הממוצע</h2><div id="phase-chart" class="svg-host"></div></section><div id="phase-result" class="figure-conclusion"></div></div>${explainSide(s)}</div>`,s.takeaway);
  const update=()=>{
    ix('phase-value').textContent=`${extraState.phase.toFixed(2)} rad`;
    ix('phase-chart').innerHTML=chart({time:phiValues,series:[{name:'phaseDetector',values:voltages,color:COLORS.capacitor,width:3.5}],domain:[-Math.PI,Math.PI],range:[-1.1,1.1],height:360,yLabel:'מוצא משווה e (V)',xLabel:'הפרש מופע',timeFactor:1,timeUnit:'rad',highlight:[extraState.phase-.03,extraState.phase+.03]});
    const e=PLL.kd*Math.sin(extraState.phase);ix('phase-result').innerHTML=`עבור <bdi>φ = ${extraState.phase.toFixed(2)} rad</bdi> מתקבל <bdi>e = ${e.toFixed(3)} V</bdi>.`;
    onResult({type:'phase-detector',phase:extraState.phase,error:e,phiValues,voltages});

}

function stopLessonAnimation(){stopEnvelopeLesson();stopAGCLesson();}
function mountLessonSlide(s,shell,onResult){
  if(s.kind==='vco-sensitivity')return r15VCO(s,shell,onResult);
  if(s.sourceNumber>=28)return r13Mount({...s,number:s.sourceNumber},shell,r=>onResult({...r,number:s.number}));
  if(s.number>=28&&s.number<=36)return r13Mount(s,shell,onResult);
  if(s.number>=21&&s.number<=27)return r12Mount(s,shell,onResult);
  if(s.number>=16&&s.number<=20)return mountR11(s,shell,onResult);
  if([2,3,4].includes(s.number))return mountEnvelopeLesson(s,shell,onResult);
  if(s.number===12)return bindRcExercise(s,shell,onResult);
  if(s.number===13||s.number===14)return mountAGCLesson(s,shell,onResult);
  if(s.number===5){
    shell(conceptBody(s),s.takeaway);
    const update=detail=>{
      ix('recovery-graphs').innerHTML=recoveryGraphs(detail);
      document.querySelectorAll('[data-recovery-view]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.recoveryView==='detail')===detail)));
      onResult({...recoveryExample(),detail,domain:detail?[.00074,.00076]:[0,.001]});
    };
    document.querySelectorAll('[data-recovery-view]').forEach(b=>b.addEventListener('click',()=>update(b.dataset.recoveryView==='detail')));update(false);return;
  }
  if(s.number===6){shell(conceptBody(s),s.takeaway);onResult(tauExample());return;}
  if(s.kind==='exercise')return bindExercise(s,shell,onResult);
  if(s.kind==='quiz')return bindQuiz(s,shell,onResult);
  if(s.kind==='slope-response'||s.kind==='slope-chain')return bindSlope(s,shell,onResult);
  if(s.kind==='phase-detector')return bindPhase(s,shell,onResult);
  if(s.kind==='distortions')return bindDistortions(s,shell,onResult);
  if(s.kind==='systems-compare'){shell(systemsTable(),s.takeaway);onResult({type:'comparison'});return;}
  shell(conceptBody(s),s.takeaway);onResult({type:'concept',number:s.number});
}

function bindR10(s,shell,onResult,config={}){

  else if (state.limit >= FM.ac * (1-FM.amDepth)) { title = 'רק חלק מהשיאים נקטמים'; text = 'שיאים גבוהים פוגשים את הסף, ושיאים נמוכים עוברים ללא קטימה. אחרי הסינון נשאר שינוי משרעת ניכר.'; }
  else { title = 'קטימה עמוקה'; text = 'השיאים נקטמים בכל מחזור. אחרי הסינון שינויי המשרעת קטנים יותר, אך לא נעלמים; גם רמת המתח יורדת.'; }
  $('limit-heading').textContent = title; $('limit-explanation').textContent = text;
  $('phase-explanation').textContent = state.phaseNoise ? 'הפרעת המופע משנה את תזמון התנודות. הקטימה אינה מבטלת אותה, וגם הסינון אינו מבטיח זאת.' : 'הפרעות תדר ומופע אינן מתוקנות מעצם הקטימה. למסנן יש השהיה.';
  document.querySelectorAll('[data-limit]').forEach(b => b.setAttribute('aria-pressed', String(Math.abs(Number(b.dataset.limit)-state.limit)<1e-9)));
  window.dispatchEvent(new CustomEvent('lesson08:updated'));
}
function showPLL() {
  pllResult ??= simulatePLL(); result = pllResult;
  shell(`<div class="layout pll-layout"><div class="plots pll-plots">
    ${legend([['תדר הכניסה', C.input], ['תדר ה־VCO', C.vco], ['מתח הבקרה', C.control]])}
    <p class="pll-preview-note">מקווקו חלש: תצוגה מקדימה מחושבת, שעדיין לא התרחשה בהדגמה. קו מודגש: עד הזמן הנוכחי.</p>
    ${plotCard('pll-frequencies', 'מי עוקב אחרי מי?', '<span class="time-readout" id="pll-time"></span>')}
    ${plotCard('pll-control', 'מתח הבקרה משנה את תדר המתנד', 'בנעילה ומעקב, השינויים במתח מייצגים את המידע')}
    <section class="card loop"><div class="blocks"><b>משווה מופע</b><span>←</span><b>מסנן</b><span>←</span><bdi><b>VCO</b></bdi></div><div class="return">משוב מהמתנד למשווה המופע ↩</div></section>
    <p class="plot-note" id="pll-window-note"></p>
  </div><div class="sidebar">
    <section class="card"><h2>עקבו אחר התהליך</h2><div class="stages">${PLL_SEGMENTS.map((s,i)=>`<button data-segment="${i}" aria-pressed="false"><small>${i+1}</small>${s.title}</button>`).join('')}</div>
      <div class="playback"><button id="play" class="primary">הפעלת ההדגמה</button><button id="restart">איפוס</button></div>
    </section>
    <section class="card readouts">${metric('תדר כניסה', 'pll-fi')}${metric('תדר VCO', 'pll-fv')}${metric('מתח בקרה', 'pll-vc')}</section>
    <section class="card status" id="pll-status" role="status" aria-live="polite"><p class="status-label">מצב הלולאה לפי החישוב</p><h2 id="pll-status-label"></h2><p id="pll-status-explanation"></p></section>
  </div></div>`, 'פער עקיבה זמני אינו בהכרח אובדן נעילה. בנעילה, מתח הבקרה מאפשר למתנד לעקוב.');
  document.querySelectorAll('[data-segment]').forEach(b => b.addEventListener('click', () => selectSegment(Number(b.dataset.segment))));
  $('play').addEventListener('click', () => {
    if (state.time >= PLL_SEGMENTS[state.segment].end) state.time = PLL_SEGMENTS[state.segment].start;
    state.playing = !state.playing; lastFrame = 0; drawPLL(); animate();
  });
  $('restart').addEventListener('click', () => { state.playing = false; state.segment = 0; state.time = 0; drawPLL(); });
  drawPLL();
}
function selectSegment(i) {
  state.segment = i; state.time = PLL_SEGMENTS[i].start; state.playing = true; lastFrame = 0; drawPLL(); animate();
}
function drawPLL() {
  if(document.querySelector('.r12-pll-root'))return r12DrawPLL();
  result = pllResult;
  const s = PLL_SEGMENTS[state.segment], status = classifyPLL(result,state.time), k=status.sampleIndex;
  const freqRange = state.segment === 3 ? [8000,14000] : [9800,10900];
  $('pll-frequencies').innerHTML = chart({time:result.time,series:[{name:'inputPreview',values:result.input,color:C.input,width:2.2,opacity:.28,dashed:true,preview:true},{name:'vcoPreview',values:result.vco,color:C.vco,width:2.2,opacity:.28,dashed:true,preview:true},{name:'inputFrequency',values:result.input,color:C.input,width:3.1},{name:'vcoFrequency',values:result.vco,color:C.vco,width:2.7}],domain:[s.start,s.end],range:freqRange,height:264,yLabel:'תדר (Hz)',cursor:state.time});
  $('pll-control').innerHTML = chart({time:result.time,series:[{name:'controlPreview',values:result.control,color:C.control,width:2.2,opacity:.28,dashed:true,preview:true},{name:'controlVoltage',values:result.control,color:C.control,width:3}],domain:[s.start,s.end],range:state.segment===3?[-1.05,1.05]:[-0.03,0.42],height:220,yLabel:'מתח בקרה (V)',cursor:state.time});
  $('pll-fi').textContent=`${fmt(result.input[k],1)} Hz`; $('pll-fv').textContent=`${fmt(result.vco[k],1)} Hz`; $('pll-vc').textContent=`${fmt(result.control[k],3)} V`;
  $('pll-time').textContent=`t = ${fmt(state.time*1000,2)} ms`;
  $('pll-status').dataset.code=status.code; $('pll-status-label').textContent=status.label; $('pll-status-explanation').textContent=status.explanation;
  $('pll-window-note').textContent=state.segment===0?'התחלה: מתח בקרה אפס; ה־VCO פועל בתדר החופשי שלו.':`חלון הזמן מתחיל לאחר ${fmt(s.start*1000,0)} ms של פעולת אותה לולאה. ציר הזמן משותף לשני הגרפים.`;
  $('play').textContent=state.playing?'עצירה':'הפעלת ההדגמה';
  document.querySelectorAll('[data-segment]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.segment)===state.segment)));
}
function animate() {
  cancelAnimationFrame(raf);
  if (!state.playing || slides[state.slide].number!==27) return;
  raf=requestAnimationFrame(now=>{
    if (!lastFrame) lastFrame=now;
    const elapsed=Math.min(0.1,(now-lastFrame)/1000);
    if (elapsed>=0.045) {
      const s=PLL_SEGMENTS[state.segment];
      state.time=Math.min(s.end,state.time+elapsed*(s.end-s.start)/5);
      lastFrame=now;
      if(state.time>=s.end) state.playing=false;
      drawPLL();
    }
    animate();
  });
}
function navigate(index) {
  stopLessonAnimation();
  state.playing=false; cancelAnimationFrame(raf); state.slide=Math.max(0,Math.min(slides.length-1,index));
  history.replaceState(null,'',`#${slides[state.slide].number}`);
  if(slides[state.slide].number===10)showEnvelope(); else if(slides[state.slide].number===18)mountR11(slides[state.slide],shell,r=>{result=r;}); else if(slides[state.slide].number===27)r12Mount(slides[state.slide],shell,r=>{result=r;}); else mountLessonSlide(slides[state.slide],shell,r=>{result=r;});
  window.dispatchEvent(new CustomEvent('lesson08:slide',{detail:{slideId:slides[state.slide].id}}));
}
$('slide-tabs').innerHTML=slides.length===3?slides.map((s,i)=>`<button data-slide="${i}" aria-pressed="false">${s.number} · ${s.number===10?'גלאי מעטפת':s.number===18?'מגבל FM':'גלאי PLL'}</button>`).join(''):[['גילוי AM',1],['גילוי FM',16],['תרגול וסיכום',32]].map(([name,n])=>`<button data-slide="${slides.findIndex(s=>s.number===n)}" aria-pressed="false">${name}</button>`).join('');
document.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>navigate(Number(b.dataset.slide))));
$('previous').addEventListener('click',()=>navigate(state.slide-1)); $('next').addEventListener('click',()=>navigate(state.slide+1));
$('notes-toggle').addEventListener('click',()=>{ $('notes').hidden=!$('notes').hidden; $('notes-toggle').setAttribute('aria-expanded',String(!$('notes').hidden)); });
$('notes-close').addEventListener('click',()=>{$('notes').hidden=true;$('notes-toggle').setAttribute('aria-expanded','false');$('notes-toggle').focus();});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{ $('fullscreen').textContent='מסך מלא אינו זמין'; }});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'יציאה ממסך מלא':'מסך מלא';fit();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){state.playing=false;$('notes').hidden=true;$('notes-toggle').setAttribute('aria-expanded','false');if($('outline')){$('outline').hidden=true;$('outline-toggle').setAttribute('aria-expanded','false');}if(slides[state.slide].number===27)drawPLL();return;}
  if(e.target.matches('input,textarea,select,[contenteditable=true]'))return;
  if(e.key==='ArrowLeft'||e.key==='PageDown'){e.preventDefault();navigate(state.slide+1);}
  if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();navigate(state.slide-1);}
  if(e.key==='Home'){e.preventDefault();navigate(0);}if(e.key==='End'){e.preventDefault();navigate(slides.length-1);}
});
window.addEventListener('resize',fit);
// Read-only diagnostics plus deterministic playback seek for QA. Both use the rendered model instance.
window.L8={get state(){return {...state};},get result(){return result;},get status(){return result?.type==='pll'?classifyPLL(result,state.time):null;},
  goTo(number){const i=slides.findIndex(s=>s.number===number);if(i<0)throw new RangeError('slide number');navigate(i);},
  seek(seconds){if(slides[state.slide].number!==27)throw new Error('PLL only');state.playing=false;state.time=Math.max(0,Math.min(r12Stages(pllResult).at(-1).end,seconds));r12Ui.stage=r12Stages(pllResult).findIndex((s,i)=>state.time>=s.start&&(state.time<s.end||i===4));state.segment=r12Ui.stage;drawPLL();},
  get catalog(){return slides;}};
if($('outline')){
  $('outline-list').innerHTML=slides.map((s,i)=>`${i===0||s.chapter!==slides[i-1].chapter?`<h3>${s.chapter}</h3>`:''}<button data-jump="${i}" title="${s.title}"><bdi>${String(s.number).padStart(2,'0')}</bdi><span>${s.title}</span><small>${s.minutes} דק׳</small></button>`).join('');
  document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{navigate(Number(b.dataset.jump));$('outline').hidden=true;$('outline-toggle').setAttribute('aria-expanded','false');$('outline-toggle').focus();}));
  $('outline-toggle').addEventListener('click',()=>{$('outline').hidden=!$('outline').hidden;$('outline-toggle').setAttribute('aria-expanded',String(!$('outline').hidden));if(!$('outline').hidden)document.querySelector('[data-jump][aria-current=step]')?.scrollIntoView({block:'center'});});
  $('outline-close').addEventListener('click',()=>{$('outline').hidden=true;$('outline-toggle').setAttribute('aria-expanded','false');$('outline-toggle').focus();});
}
document.body.dataset.lessonId='lesson-08';document.body.dataset.courseId='communication-systems';document.body.dataset.slides=JSON.stringify(slides.map(s=>({slideId:s.id,slideNumber:s.number,title:s.title,minutes:s.minutes,chapter:s.chapter})));
if(!location.hash){try{const saved=Number(localStorage.getItem(`syllo:lesson08:${slides.length}:index`)),i=slides.findIndex(s=>s.number===saved);if(i>=0)state.slide=i;}catch{}}
window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1)),i=slides.findIndex(s=>s.number===n);if(i>=0)navigate(i);});
navigate(state.slide);

</script>
