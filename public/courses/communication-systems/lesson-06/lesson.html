#293b50;overflow:hidden;border-radius:9px;flex:1}.progress i{display:block;height:100%;background:#30b47b}.small{color:#c1ceda;font-size:13px}.answers{display:grid;gap:8px}.answer{display:none}.answer.show{display:block}.break{justify-content:center;text-align:center;align-items:center;background:#173d32;color:white}.break h1{font-size:clamp(40px,6vw,88px)}.plot{width:100%;max-height:28%;margin:auto}.flow{display:flex;align-items:center;justify-content:center;gap:8px;direction:ltr;flex-wrap:wrap}.flow span{background:#e9f5ee;color:var(--ink);padding:12px;border-radius:10px;font-weight:700}.lab{border:1px solid #cbd7df;border-radius:12px;background:#f7faf9;padding:12px}.lab p{margin:5px 0;line-height:1.4}.lab label{display:block;font-weight:700}.lab input{width:min(100%,480px);vertical-align:middle;accent-color:#008f4d}.lab svg{width:100%;height:110px;display:block}.lab .readout{font-weight:700;color:#08754c}@media(max-width:850px){.app{padding:8px}.layout{grid-template-columns:1fr}.toc{max-height:170px;order:2}.slide{width:min(100%,calc((100dvh - 300px)*16/9));padding:5%}.top{flex-wrap:wrap}.bottom{flex-wrap:wrap}.body{gap:6px}.card{padding:8px 10px}.foot{font-size:10px}}

<script>
const slides=[{"n":1,"ch":0,"sec":false,"min":4,"eb":"מערכות תקשורת · שיעור 06","h":"עקרון אפנון FM ומשדר","tk":"ב־FM המידע משנה את התדר הרגעי; תנופת הנושא נשארת קבועה.","notes":"פתח בשאלה: מה משתנה בגל כשמדברים למיקרופון? הצג את מפת השיעור ואת הקשר לפרק 6 בסילבוס.","reveal":false,"body":"FM · Frequency Modulation|נבנה את עקרון האפנון מן ההגדרה ועד לאות המתמטי.|נחשב סטייה, β, רוחב פס והספק; אחר כך ננתח VCO ומכפיל תדר.|בסוף נפתור תרגיל משדר מלא ונבדוק יחידות."},{"n":2,"ch":0,"sec":false,"min":4,"eb":"שאלה מניעה","h":"מה רעש עושה לאות AM ולמה FM עוזר?","tk":"מגביל משרעת יכול להחליש רעש משרעת לפני גילוי FM; הוא לא מעלים כל רעש.","notes":"הדגם שמקלט AM מפענח שינויי מעטפת, ולכן הפרעת משרעת יכולה להישמע. מקלט FM מגביל משרעת לפני הגילוי, בתנאים מתאימים.","reveal":false,"body":"ב־AM המידע מיוצג בשינוי מעטפת האות; הפרעת משרעת יכולה להיכנס למידע המפוענח.|ב־FM המידע מיוצג בשינויי תדר. מגביל במקלט מסיר חלק משינויי המשרעת לפני גלאי התדר.|מגבלות: רעש תדר, קליטה חלשה והפרעות עדיין עלולים לפגוע באות.|שאלת פתיחה: אם תנופת גל FM משתנה בגלל הפרעה, האם בהכרח אבד המידע?"},{"n":3,"ch":0,"sec":false,"min":5,"eb":"גישור · שיעורים 1–5","h":"הסימונים והיחידות שנצטרך","tk":"f נמדד ב־Hz; ω=2πf נמדד ב־rad/s.","notes":"עצרו על ההבדל בין תדר מחזורי לתדר זוויתי. ודאו שהתלמידים מבחינים בין תנופה במתח לבין תדר.","reveal":false,"body":"אות מידע: x(t)=Aₘ cos(ωₘt), כאשר Aₘ [V], fₘ [Hz], ωₘ=2πfₘ [rad/s].|נושא לא מאופנן: c(t)=A꜀ cos(ω꜀t), כאשר A꜀ [V], f꜀ [Hz], ω꜀=2πf꜀ [rad/s].|תדר הוא מספר מחזורים לשנייה; תדר זוויתי הוא קצב שינוי מופע ברדיאנים לשנייה.|מהשיעורים הקודמים: AM משנה מעטפת; מסנן BPF בוחר תחום תדרים; ערבל יוצר רכיבי סכום והפרש."},{"n":4,"ch":1,"sec":false,"min":5,"eb":"הגדרה","h":"FM מתאר קשר בין מתח המידע לתדר הרגעי","tk":"f(t)=f꜀+Kf·x(t); Kf קובע כמה Hz משתנים לכל וולט.","notes":"הבהר שזו הגדרת מודל FM ליניארי. אם x(t)=0 התדר הרגעי שווה לתדר המרכז f꜀.","reveal":false,"body":"נגדיר את התדר הרגעי כך: f(t)=f꜀+Kf·x(t) [Hz].|f꜀ הוא תדר המרכז ללא אפנון; x(t) הוא מתח המידע; Kf [Hz/V] היא רגישות התדר.|כאשר x(t)>0 התדר גבוה מ־f꜀; כאשר x(t)\u003c0 התדר נמוך מ־f꜀.|בדיקת הבנה: מהו f(t) ברגע שבו x(t)=0?"},{"n":5,"ch":1,"sec":false,"min":5,"eb":"אות מידע סינוסואידלי","h":"מציבים את x(t) ומוצאים את קצב שינוי התדר","tk":"האמפליטודה של המידע קובעת את גודל הסטייה; fₘ קובע כמה מהר היא משתנה.","notes":"השתמשו באות מידע סינוסואידלי כדי להגיע לנוסחאות הסגורות. אל תבלבלו בין fₘ לבין סטיית התדר.","reveal":false,"body":"נבחר x(t)=Aₘ cos(ωₘt)=Aₘ cos(2πfₘt).|בהצבה בהגדרה: f(t)=f꜀+KfAₘ cos(ωₘt).|הקוסינוס נע בין −1 ל־+1. לכן f(t) נע סביב f꜀, באותה תדירות fₘ של אות המידע.|במעבר האות דרך האפס: f(t)=f꜀. בשיא החיובי מתקבל התדר הגבוה; בשיא השלילי התדר הנמוך."},{"n":6,"ch":1,"sec":false,"min":5,"eb":"סטיית תדר","h":"גוזרים את Δf ואת שני הקצוות","tk":"Δf=KfAₘ; הקצוות סימטריים סביב f꜀.","notes":"רשמו יחידות בכל שורה. אם Kf ב־kHz/V ו־Aₘ בוולט, התוצאה היא kHz.","reveal":false,"body":"המקדם של הקוסינוס הוא גודל הסטייה המרבית: Δf=KfAₘ [Hz].|לכן fmax=f꜀+Δf, כי cos(ωₘt)=+1 בשיא החיובי.|בדומה, fmin=f꜀−Δf, כי cos(ωₘt)=−1 בשיא השלילי.|דוגמה: Kf=5 kHz/V, Aₘ=2 V ⇒ Δf=10 kHz. אם f꜀=100 kHz, הקצוות הם 110 kHz ו־90 kHz."},{"n":7,"ch":1,"sec":false,"min":5,"eb":"מקדם אפנון","h":"β משווה סטייה לתדר המידע","tk":"β=Δf/fₘ הוא חסר יחידות ואינו מוגבל ל־1.","notes":"הדגישו ש־β הוא יחס מאפיין FM; אין לקרוא לו אחוז אפנון או להעתיק אליו את מגבלת AM.","reveal":false,"body":"מגדירים β=Δf/fₘ. המונה והמכנה שניהם ב־Hz, לכן β חסר יחידות.|בדוגמה: Δf=10 kHz ו־fₘ=5 kHz ⇒ β=2.|β גדול יותר פירושו שינוי מופע גדול יותר לאורך מחזור מידע; הוא אינו אומר שהתנופה גדלה.|ב־AM מקדם mₐ=Aₘ/A꜀ מתאר יחס תנופות. במודל AM עם גלאי מעטפת מקובל להימנע מ־mₐ>1; ל־β ב־FM אין מגבלת 1 מקבילה."},{"n":8,"ch":1,"sec":false,"min":9,"eb":"מהתדר למופע","h":"גוזרים את אות FM באמצעות אינטגרציה","tk":"מופע הוא האינטגרל של 2πf(t); מכאן מופיעה פונקציית הסינוס בתוך הקוסינוס.","notes":"זהו החיבור המתמטי המרכזי. התקדמו שורה אחר שורה והסבירו את האינטגרל של cos.","reveal":false,"body":"תדר זוויתי רגעי הוא ω(t)=2πf(t), וקצב שינוי המופע הוא dφ/dt=ω(t).|לכן φ(t)=φ₀+∫₂πf(τ)dτ. נציב f(τ)=f꜀+KfAₘcos(ωₘτ).|אינטגרל רכיב הנושא: ∫₂πf꜀dτ=2πf꜀t=ω꜀t.|אינטגרל רכיב המידע: ∫2πKfAₘcos(ωₘτ)dτ=(2πKfAₘ/ωₘ)sin(ωₘt).|מכיוון ש־ωₘ=2πfₘ ו־Δf=KfAₘ, המקדם הוא Δf/fₘ=β."},{"n":9,"ch":1,"sec":false,"min":4,"eb":"האות המלא","h":"מכניסים את המופע לאות קוסינוס","tk":"xFM(t)=A꜀cos[ω꜀t+βsin(ωₘt)].","notes":"אפשר לבחור מופע התחלתי אפס בלי לאבד את עקרון השיעור. בדקו את היחידות: הארגומנט של cos חסר יחידות.","reveal":false,"body":"אות סינוסואידלי שמופעו φ(t) נכתב x(t)=A꜀cos[φ(t)].|מהאינטגרציה: φ(t)=ω꜀t+βsin(ωₘt). לכן xFM(t)=A꜀cos[ω꜀t+βsin(ωₘt)].|תנופת האות היא תמיד A꜀. המידע משנה את שיפוע המופע, כלומר את התדר הרגעי.|בדיקה: אם Aₘ=0 אז β=0, ומקבלים בחזרה את הנושא הלא־מאופנן A꜀cos(ω꜀t)."},{"n":10,"ch":1,"sec":false,"min":4,"eb":"המחשה בזמן","h":"תדירות משתנה נראית כגל צפוף או מרווח","tk":"צפיפות המחזורים משתנה; גובה המעטפת נשאר קבוע.","notes":"בקשו מהכיתה לזהות את רגעי fmax ו־fmin בגרף ולחבר אותם לסימן אות המידע.","reveal":false,"body":"כאשר x(t) חיובי, f(t)>f꜀ והמחזורים צפופים יותר.|כאשר x(t) שלילי, f(t)\u003cf꜀ והמחזורים מרווחים יותר.|כאשר x(t)=0, התדר חוזר ל־f꜀. המעטפת נשארת בגובה A꜀.|שאלו: האם שינוי מהירות התנודה הוא שינוי תנופה? הסבירו באמצעות הגרף."},{"n":11,"ch":2,"sec":false,"min":8,"eb":"רוחב פס · נוסחת קרסון","h":"מעריכים רוחב פס בלי לספור כל פס צד","tk":"BW≈2(Δf+fₘ)=2(β+1)fₘ; זו הערכה הנדסית.","notes":"אל תציגו 98% כחוק מדויק לכל אות. הספקטרום האידאלי מכיל אינסוף רכיבים; קרסון נותן אומדן שימושי בתנאים המקובלים.","reveal":false,"body":"אות FM עשוי להכיל את הנושא ופסי צד רבים; מספר הרכיבים המשמעותיים תלוי ב־β.|כלל קרסון: BW≈2(Δf+fₘ). מכיוון ש־Δf=βfₘ, מתקבל גם BW≈2(β+1)fₘ.|בדוגמה: Δf=90 kHz, fₘ=10 kHz ⇒ BW≈2(90+10) kHz=200 kHz.|הסימן ≈ חשוב: זו הערכה מעשית לרוחב התחום שתופס בקירוב את רוב ההספק, ולא גבול ספקטרלי מוחלט."},{"n":12,"ch":2,"sec":false,"min":4,"eb":"סיווג FM","h":"צר־פס ורחב־פס הם תחומי קירוב","tk":"β≪1: BW≈2fₘ; β≫1: BW≈2Δf.","notes":"אין סף חד בין צר־פס לרחב־פס. הציגו את הביטויים כגבולות בקירוב.","reveal":false,"body":"ב־NBFM, כאשר β≪1, הסטייה קטנה ביחס ל־fₘ והקירוב BW≈2fₘ שימושי.|ב־WBFM, כאשר β≫1, הסטייה שולטת ולכן BW≈2Δf.|בין התחומים אין מתג או גבול חד; כלל קרסון נותן קירוב רציף בשניהם.|תרגול בעל פה: עבור Δf=2 kHz ו־fₘ=20 kHz, האם β קטן או גדול מ־1?"},{"n":13,"ch":2,"sec":false,"min":7,"eb":"הספק FM","h":"מוכיחים שההספק הכולל אינו תלוי ב־β","tk":"מעטפת קבועה גוררת PFM=Pc=A꜀²/(2R), במודל הסינוס האידאלי.","notes":"הספק קבוע אינו אומר שכל קו ספקטרלי קבוע. חלוקת ההספק בין הנושא לפסי הצד משתנה עם β.","reveal":false,"body":"לגל סינוס בעל תנופת שיא A꜀ על עומס התנגדות R, ההספק הממוצע הוא P=A꜀²/(2R).|אות FM אידאלי: xFM(t)=A꜀cos(φ(t)). מכיוון שהמעטפת A꜀ קבועה, ממוצע cos² לאורך מחזורים הוא 1/2.|לכן PFM=A꜀²/(2R)=Pc, ללא תלות באות המידע או ב־β.|β משנה את חלוקת ההספק בין הנושא לפסי הצד; סכום ההספק נשאר קבוע. נצילות המשדר תלויה גם בתכנון ובדרגת ההספק."},{"n":14,"ch":2,"sec":false,"min":6,"eb":"תרגול מודרך","h":"פותרים דוגמה קצרה עם יחידות","tk":"מחשבים כל גודל מן ההגדרה שלו, ושומרים יחידות לאורך הדרך.","notes":"חשפו את התוצאה רק אחרי ניסיון קצר. בקשו מהתלמידים להצדיק את fmax ו־fmin ולא רק להציב מספרים.","reveal":true,"body":"נתונים: Kf=4 kHz/V, Aₘ=1.5 V, fₘ=8 kHz, f꜀=100 kHz, A꜀=10 V, R=50 Ω.|חשבו: Δf, β, fmax, fmin, רוחב פס קרסון והספק.|רמז 1: התחילו ב־Δf=KfAₘ. אחר כך הציבו ב־β=Δf/fₘ.|פתרון: Δf=6 kHz; β=0.75; fmax=106 kHz; fmin=94 kHz; BW≈28 kHz; P=10²/(2·50)=1 W."},{"n":15,"ch":2,"sec":false,"min":5,"eb":"בדיקת הבנה","h":"בדקו גם סדרי גודל","tk":"אם Kf מוכפל, Δf מוכפלת; אם fₘ קבוע, גם β מוכפל.","notes":"שאלו אילו תוצאות אמורות להיות סימטריות סביב f꜀ ואילו אינן תלויות ב־A꜀.","reveal":false,"body":"בתרגיל הקודם: fmax+fmin=212 kHz=2f꜀. זו בדיקת סימטריה.|BW≈28 kHz גדול מ־2Δf=12 kHz, כפי שנדרש בתוספת רכיב fₘ בכלל קרסון.|ההספק תלוי ב־A꜀ ובעומס R; הוא לא תלוי ב־Kf, Aₘ או fₘ במודל האידאלי.|אם שכחתם להמיר kHz ל־Hz, תוכלו לטעות בפקטור 1000; כתבו יחידות בכל שלב."},{"n":16,"ch":2,"sec":true,"min":10,"eb":"הפסקה","h":"הפסקה · 10 דקות","tk":"אחריה נבנה את שרשרת המשדר ונראה מה עושה מכפיל תדר.","notes":"עשר דקות הפסקה.","reveal":false,"body":"10 דקות הפסקה"},{"n":17,"ch":3,"sec":false,"min":5,"eb":"מתנד מבוקר מתח","h":"VCO ממיר מתח לתדר","tk":"בתחום ליניארי: fout=f₀+Kfvin.","notes":"הגרף איכותי. ציינו שמימושים אמיתיים מוגבלים לטווח כוונון ולסטיות של הרכיב.","reveal":false,"body":"VCO הוא Voltage Controlled Oscillator: מתח הכניסה קובע את תדר התנודה.|מודל בתחום עבודה ליניארי: fout=f₀+Kfvin.|Kf הוא שיפוע האופיין: שינוי תדר חלקי שינוי מתח, ביחידות Hz/V.|במעגל אמיתי יש טווח כוונון, אי־ליניאריות ורעש מופע; המודל כאן מתאר את תחום העבודה."},{"n":18,"ch":3,"sec":false,"min":5,"eb":"שרשרת המשדר","h":"כל בלוק ממלא תפקיד מוגדר","tk":"מגבר השמע מתאים את אות המידע; ה־VCO יוצר FM; ה־PA מספק הספק לאנטנה.","notes":"הציגו את השרשרת ובקשו מהתלמידים לתאר כניסה ויציאה של כל בלוק.","reveal":false,"body":"מיקרופון → מגבר שמע → VCO → מכפיל תדר ×n → מגבר הספק PA → אנטנה.|מגבר השמע מתאים את רמת המתח ולעיתים גם את תחום התדרים של המידע.|ה־VCO יוצר סטיית תדר ביחס למתח. המכפיל מעלה תדר נושא וסטייה. ה־PA מספק הספק שידור.|תכנון בפועל כולל גם מסננים, מייצבי תדר, התאמת עכבות והגנות; השרשרת מציגה את עקרון הפעולה."},{"n":19,"ch":3,"sec":false,"min":5,"eb":"מכפיל תדר","h":"גוזרים מה קורה אחרי ×n","tk":"f꜀′=nf꜀; Δf′=nΔf; β′=nβ; fₘ נשאר קבוע.","notes":"הסבירו שמכפיל ממשי משתמש באי־ליניאריות כדי ליצור הרמוניות ובמסנן לבחירת ההרמוניה. אינו מכפיל את אות השמע.","reveal":false,"body":"הכפלת תדר אידאלית ב־n מכפילה את קצב המופע ולכן את התדר המרכזי: f꜀′=nf꜀.|גם סטיית התדר סביב המרכז גדלה פי n: Δf′=nΔf.|מכיוון ש־fₘ אינו משתנה, β′=Δf′/fₘ=nΔf/fₘ=nβ.|אות המידע ממשיך להשתנות בקצב המקורי. רק תדר הגל המאופנן ותנודת התדר שלו גדלים.|מימוש פיזי: רכיב לא־ליניארי יוצר הרמוניות; מסנן בוחר את ההרמוניה הרצויה."},{"n":20,"ch":4,"sec":false,"min":6,"eb":"תרגיל מסכם · נתונים","h":"מתחילים מנתוני ה־VCO","tk":"קודם פותרים לפני המכפיל; אחרי כן מעדכנים f꜀ ו־Δf.","notes":"תנו לתלמידים שבע דקות עצמאיות/בזוגות בתחילת העבודה על התרגיל; לאחר מכן עברו לפתרון המודרך בשקפים הבאים.","reveal":false,"body":"מכפיל תדר n=12; רגישות VCO: Kf=2.5 kHz/V; תדר מרכז f₀=7.5 MHz.|אות המידע: vm(t)=3cos(2π·10·10³t) V, לכן Aₘ=3 V ו־fₘ=10 kHz.|נתוני יציאה: A꜀=20 V peak על עומס R=50 Ω.|מצאו את פרמטרי ה־VCO, את אות היציאה אחרי המכפיל, BW לפי קרסון וההספק."},{"n":21,"ch":4,"sec":false,"min":7,"eb":"פתרון · שלב א","h":"מחשבים סטייה ו־β ביציאת VCO","tk":"Δf₀=7.5 kHz; β₀=0.75.","notes":"המירו Kf ל־2500 Hz/V רק אם ממשיכים לעבוד ב־Hz. מותר לחשב ב־kHz באופן עקבי.","reveal":false,"body":"המרת יחידות: Kf=2.5 kHz/V=2500 Hz/V; Aₘ=3 V; fₘ=10 kHz=10,000 Hz.|סטיית התדר ביציאת ה־VCO: Δf₀=KfAₘ=(2.5 kHz/V)(3 V)=7.5 kHz=7500 Hz.|מקדם האפנון ביציאת VCO: β₀=Δf₀/fₘ=7.5/10=0.75.|בדיקת יחידות: kHz חלקי kHz מבטל יחידות. התוצאה ללא יחידות."},{"n":22,"ch":4,"sec":false,"min":7,"eb":"פתרון · שלב ב","h":"מעבירים את הפרמטרים דרך ×12","tk":"f꜀=90 MHz; Δf=90 kHz; β=9; fₘ=10 kHz.","notes":"הציגו בדיקת β בשתי דרכים כדי לקבע את הקשר בין הפרמטרים.","reveal":false,"body":"תדר הנושא ביציאה: f꜀=nf₀=12·7.5 MHz=90 MHz.|סטיית התדר: Δf=nΔf₀=12·7.5 kHz=90 kHz.|מקדם אפנון: β=nβ₀=12·0.75=9. בדיקה: β=Δf/fₘ=90/10=9.|אות המידע נשאר fₘ=10 kHz; לכן הקצוות הם fmax=90.09 MHz ו־fmin=89.91 MHz."},{"n":23,"ch":4,"sec":false,"min":7,"eb":"פתרון · רוחב פס, אות והספק","h":"משלימים את החישוב עם שתי בדיקות","tk":"BW≈200 kHz; xFM(t)=20cos[2π·90·10⁶t+9sin(2π·10⁴t)] V; P=4 W.","notes":"אל תסיקו ש־200 kHz הוא רוחב ערוץ תקני בכל שירות. זהו תוצאת כלל קרסון לדוגמה. הספק מחושב בהנחת 20 V peak על 50 Ω.","reveal":false,"body":"רוחב פס קרסון: BW≈2(Δf+fₘ)=2(90+10) kHz=200 kHz.|הצבה באות: xFM(t)=20cos[2π·90·10⁶t+9sin(2π·10⁴t)] V.|הספק ממוצע: PFM=A꜀²/(2R)=20²/(2·50)=400/100=4 W.|בדיקה: fmax+fmin=180 MHz=2f꜀; תחום התדר סימטרי סביב המרכז.|הערה: 90 MHz הוא תדר דוגמה. כלל קרסון אינו קובע לבדו הקצאת ערוץ או תקן שידור."},{"n":24,"ch":4,"sec":false,"min":3,"eb":"כרטיס יציאה","h":"הסבירו, חשבו, ובדקו היגיון","tk":"הסבר פיזיקלי, נוסחה, יחידות ובדיקת היגיון משלימים זה את זה.","notes":"תנו 60 שניות כתיבה עצמאית. אספו תשובות או בדקו בהרמת ידיים.","reveal":true,"body":"אם f꜀=100 MHz ו־Δf=75 kHz, מגבירים את תנופת המידע פי 2. מה קורה ל־f꜀, ל־Δf ולהספק הכולל?|תשובת מפתח: f꜀ נשאר 100 MHz; Δf נעשית 150 kHz; PFM נשאר קבוע במודל FM אידאלי, אם A꜀ ו־R קבועים.|חוקי סיכום: Δf=KfAₘ; β=Δf/fₘ; BW≈2(Δf+fₘ); מכפיל ×n משנה f꜀, Δf ו־β ומשאיר fₘ ללא שינוי."}];const chapters=["פתיחה וגישור","עקרון FM ומדדיו","רוחב פס והספק","משדר FM ומכפיל תדר","תרגול וסיכום"];
let index=0,showNotes=false;const stage=document.getElementById('stage'),toc=document.getElementById('toc');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function labMarkup(n){if(![10,17,19].includes(n))return '';const mode=n===10?'fm':n===17?'vco':'multiplier';const title=mode==='fm'?'תדר רגעי ומעטפת':mode==='vco'?'אופיין VCO':'מכפיל תדר';const label=mode==='fm'?'תנופת מידע':mode==='vco'?'מתח כניסה':'מכפיל n';const max=mode==='multiplier'?12:100,step=mode==='multiplier'?2:1,start=mode==='multiplier'?4:55;const expl=mode==='fm'?'שנו את תנופת המידע: סטיית התדר משתנה, אך מעטפת האות נשארת קבועה.':mode==='vco'?'הזיזו את מתח הכניסה וראו כיצד תדר היציאה עולה בתחום הליניארי.':'הגדילו את n: תדר הנושא וסטייתו גדלים; תדר המידע נשאר קבוע.';return '<section class="lab" data-mode="'+mode+'"><p><b>מעבדת המחשה · '+title+'</b></p><p>'+expl+'</p><label>'+label+' <output>'+start+'</output><input type="range" min="'+(mode==='multiplier'?2:0)+'" max="'+max+'" step="'+step+'" value="'+start+'"></label><svg viewBox="0 0 720 180" role="img" aria-label="גרף אינטראקטיבי מתעדכן"><line x1="0" x2="720" y1="90" y2="90" stroke="#94a3b8"/><path class="curveA" fill="none" stroke="#1583a5" stroke-width="3"/><path class="curveB" fill="none" stroke="#13a06f" stroke-width="3"/></svg><p class="readout" aria-live="polite"></p></section>';}
function initLab(){const lab=stage.querySelector('.lab');if(!lab)return;const mode=lab.dataset.mode,input=lab.querySelector('input'),out=lab.querySelector('output'),readout=lab.querySelector('.readout'),a=lab.querySelector('.curveA'),b=lab.querySelector('.curveB');function draw(){const value=Number(input.value);out.value=String(value);const pts=(fn)=>Array.from({length:401},(_,i)=>{const x=i/400,t=x*Math.PI*2;return (i?'L':'M')+(x*720).toFixed(1)+' '+(90-62*fn(t,x,value)).toFixed(1)}).join(' ');if(mode==='fm'){a.setAttribute('d',pts((t)=>Math.cos(14*t+(value/35)*Math.sin(t))));b.setAttribute('d',pts((t)=>Math.sin(t)*value/100));readout.textContent='Δf גדלה עם Aₘ; מעטפת אות FM נשארת קבועה.'}else if(mode==='vco'){a.setAttribute('d',pts((t,x)=>Math.cos(12*t)));b.setAttribute('d',pts((t,x)=>x*2-1));readout.textContent='fout=f₀+Kf·vin · נקודת מתח: '+(value/10).toFixed(1)+' V · שיפוע הקו הוא Kf.'}else{a.setAttribute('d',pts((t)=>Math.cos(8*t+1.2*Math.sin(t))));b.setAttribute('d',pts((t)=>Math.cos((8+value*2)*t+1.2*Math.sin(t))));readout.textContent='f꜀′=n·f꜀ ו־Δf′=n·Δf עבור n='+value+'; fₘ נשאר ללא שינוי.'}}input.addEventListener('input',draw);draw()}
function render(){const s=slides[index], rows=s.body.split('|'), answers=s.reveal, content=answers?rows.slice(0,-1):rows;stage.innerHTML='';const card=document.createElement('article');card.className='slide'+(s.sec?' break':'');card.innerHTML='<div class="eyebrow">'+esc(s.eb)+'</div><h2>'+esc(s.h)+'</h2><div class="body">'+content.map(x=>'<div class="card">'+esc(x)+'</div>').join('')+labMarkup(s.n)+(answers?'<button class="reveal" id="reveal">חשיפת הפתרון</button><div class="card answer" id="answer">'+esc(rows.at(-1))+'</div>':'')+'</div>'+(s.tk?'<div class="takeaway"><b>העיקר · </b>'+esc(s.tk)+'</div>':'')+(showNotes&&s.notes?'<div class="card">'+esc(s.notes)+'</div>':'')+'<div class="foot"><span>'+esc(chapters[s.ch]||'הפסקה')+'</span><span dir="ltr">'+String(s.n).padStart(2,'0')+'</span></div>';stage.append(card);initLab();document.getElementById('count').textContent=String(s.n).padStart(2,'0')+' / '+slides.length;document.getElementById('chapter').textContent=chapters[s.ch]||'הפסקה';document.getElementById('bar').style.width=((index+1)/slides.length*100)+'%';[...toc.querySelectorAll('button')].forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));document.getElementById('reveal')?.addEventListener('click',()=>{document.getElementById('answer').classList.add('show');document.getElementById('reveal').remove()});}
toc.innerHTML='<h2>תוכן השיעור</h2>'+slides.map((s,i)=>'<button type="button" data-index="'+i+'">'+String(s.n).padStart(2,'0')+' · '+esc(s.h)+'</button>').join('');toc.addEventListener('click',e=>{const b=e.target.closest('button[data-index]');if(b){index=Number(b.dataset.index);render()}});document.getElementById('prev').onclick=()=>{index=Math.max(0,index-1);render()};document.getElementById('next').onclick=()=>{index=Math.min(slides.length-1,index+1);render()};document.getElementById('notes').onclick=()=>{showNotes=!showNotes;render()};document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,button'))return;if(e.key==='ArrowLeft'||e.key==='PageDown'){index=Math.min(slides.length-1,index+1);render()}if(e.key==='ArrowRight'||e.key==='PageUp'){index=Math.max(0,index-1);render()}});render();
</script></body></html>
