<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><title>Syllo — מפגשי מרצה</title><style>body{font:16px Arial;margin:32px;color:#17202a}button,select,input{padding:8px;margin:5px;border:1px solid #cbd5e1;border-radius:6px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:right;white-space:pre-line}.signal{background:#fff1ce}.mark{color:#804400;font-weight:bold}.muted{color:#64748b}.error{color:#9f1239}</style><h1>Syllo · מפגשי מרצה</h1><p class="muted">העותק המקומי נשאר גם אם הסנכרון נכשל. זמן ארוך מהמתוכנן הוא אות להתבוננות, לא אבחנה של קושי.</p><details><summary>הגדרת סנכרון</summary><p><button id="token">הנפקת אסימון Syllo</button><span id="token-status" class="muted"></span></p><p>הפעולה פותחת חלון אימות של אזור המרצה ומנפיקה אסימון תקף ל־8 שעות.</p></details><p><select aria-label="מפגש שמור" id="sessions"></select><button id="sync">סנכרון ל־Syllo</button><button id="export">ייצוא JSON</button></p><p id="details"></p><table><thead><tr><th>שקף</th><th>מתוכנן</th><th>פעיל בפועל</th><th>סימון</th><th>סומן ב־</th></tr></thead><tbody></tbody></table><script src="config.js"></script><script src="history.js"></script></html>
